<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARU TOPUP Admin</title>

<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{margin:0;background:#080d18;color:white}
header{padding:18px;background:#101a2e;text-align:center;border-bottom:2px solid #176bff}
header h2{color:#4d91ff;margin:0}
.container{max-width:1100px;margin:auto;padding:18px}
.login{max-width:400px;margin:70px auto;background:#101a2e;padding:25px;border-radius:12px}
input,select,button{width:100%;padding:12px;margin:8px 0;border-radius:7px;border:1px solid #263b60;background:#111d32;color:white}
button{background:#176bff;border:0;font-weight:bold;cursor:pointer}
button:hover{background:#0052db}
.dashboard{display:none}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0}
.stat,.order,.section{background:#101a2e;padding:16px;border-radius:10px;margin-bottom:15px}
.stat{text-align:center}
.stat h3{color:#4d91ff}
.stat p{font-size:24px;font-weight:bold}
.order{border:1px solid #263b60;overflow-wrap:anywhere}
.order h3{color:#4d91ff}
.order p{margin:7px 0}
.pending{color:#ffcc00}
.completed{color:#00e676}
.cancelled{color:#ff5252}
.logout{background:#e53935}
.refresh{background:#283d60}
.tabs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:20px 0}
.tabs button{background:#172640}
.tabs button.active{background:#176bff}
.section h3{color:#4d91ff}
.hidden{display:none}
@media(max-width:600px){.stats{grid-template-columns:1fr}.container{padding:12px}}
</style>
</head>

<body>

<header>
<h2>🎮 ARU TOPUP</h2>
<p>ADMIN CONTROL PANEL</p>
</header>

<div class="container">

<!-- LOGIN -->
<div class="login" id="loginBox">
<h2 style="text-align:center;color:#4d91ff">🔐 Admin Login</h2>
<input type="password" id="password" placeholder="Admin Password">
<button onclick="login()">LOGIN</button>
<p id="loginMessage"></p>
</div>

<!-- DASHBOARD -->
<div class="dashboard" id="dashboard">

<div class="stats">
<div class="stat"><h3>Total Orders</h3><p id="totalOrders">0</p></div>
<div class="stat"><h3>Pending</h3><p id="pendingOrders">0</p></div>
<div class="stat"><h3>Completed</h3><p id="completedOrders">0</p></div>
</div>

<button class="refresh" onclick="loadOrders()">🔄 Refresh Orders</button>
<button class="logout" onclick="logout()">Logout</button>

<div class="tabs">
<button onclick="filterOrders('All',this)" class="active">All Orders</button>
<button onclick="filterOrders('Pending',this)">Pending</button>
<button onclick="filterOrders('Completed',this)">Completed</button>
<button onclick="filterOrders('Cancelled',this)">Cancelled</button>
</div>

<input id="search" placeholder="🔍 Search UID / Player / Transaction ID" oninput="renderOrders()">

<div id="orders">Loading...</div>

</div>
</div>

<script>
let adminToken = "";
let allOrders = [];
let currentFilter = "All";

async function login(){
  const password=document.getElementById("password").value;
  const message=document.getElementById("loginMessage");

  if(!password){
    message.innerText="Enter password";
    return;
  }

  try{
    const response=await fetch("/api/admin/login",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({password})
    });

    const data=await response.json();

    if(!response.ok){
      message.innerText="Wrong password!";
      return;
    }

    adminToken=data.token;

    document.getElementById("loginBox").style.display="none";
    document.getElementById("dashboard").style.display="block";

    loadOrders();

  }catch(error){
    message.innerText="Server connection error";
  }
}

async function loadOrders(){
  const box=document.getElementById("orders");
  box.innerHTML="Loading orders...";

  try{
    const response=await fetch("/api/admin/orders",{
      headers:{
        "Authorization":"Bearer "+adminToken
      }
    });

    if(!response.ok){
      box.innerHTML="Unable to load orders. Check server.js";
      return;
    }

    allOrders=await response.json();

    document.getElementById("totalOrders").innerText=allOrders.length;
    document.getElementById("pendingOrders").innerText=
      allOrders.filter(o=>o.status==="Pending").length;
    document.getElementById("completedOrders").innerText=
      allOrders.filter(o=>o.status==="Completed").length;

    renderOrders();

  }catch(error){
    box.innerHTML="Connection error";
  }
}

function filterOrders(status,button){
  currentFilter=status;

  document.querySelectorAll(".tabs button").forEach(b=>{
    b.classList.remove("active");
  });

  button.classList.add("active");
  renderOrders();
}

function renderOrders(){
  const box=document.getElementById("orders");
  const search=document.getElementById("search").value.toLowerCase();

  let filtered=allOrders.filter(order=>{
    const statusMatch=currentFilter==="All"||
      order.status===currentFilter;

    const searchMatch=
      String(order.uid||"").toLowerCase().includes(search)||
      String(order.playerName||"").toLowerCase().includes(search)||
      String(order.transactionId||"").toLowerCase().includes(search);

    return statusMatch&&searchMatch;
  });

  if(!filtered.length){
    box.innerHTML="<div class='section'>No orders found.</div>";
    return;
  }

  box.innerHTML="";

  filtered.forEach(order=>{
    const div=document.createElement("div");
    div.className="order";

    const statusClass=
      order.status==="Completed"?"completed":
      order.status==="Cancelled"?"cancelled":"pending";

    div.innerHTML=`
      <h3>📦 Order #${escapeHTML(order.id)}</h3>
      <p><b>UID:</b> ${escapeHTML(order.uid)}</p>
      <p><b>Player:</b> ${escapeHTML(order.playerName)}</p>
      <p><b>Package:</b> ${escapeHTML(order.package)}</p>
      <p><b>Price:</b> ৳${Number(order.price)||0}</p>
      <p><b>Transaction ID:</b> ${escapeHTML(order.transactionId)}</p>
      <p><b>Date:</b> ${escapeHTML(order.createdAt)}</p>
      <p><b>Status:</b> <span class="${statusClass}">
      ${escapeHTML(order.status)}</span></p>

      <select id="status-${order.id}">
        <option value="Pending">Pending</option>
        <option value="Completed">Completed</option>
        <option value="Cancelled">Cancelled</option>
      </select>

      <button onclick="updateStatus('${order.id}')">
      Update Order Status</button>
    `;

    box.appendChild(div);

    div.querySelector("select").value=order.status||"Pending";
  });
}

async function updateStatus(id){
  const status=document.getElementById("status-"+id).value;

  try{
    const response=await fetch(
      "/api/admin/orders/"+encodeURIComponent(id),
      {
        method:"PATCH",
        headers:{
          "Content-Type":"application/json",
          "Authorization":"Bearer "+adminToken
        },
        body:JSON.stringify({status})
      }
    );

    const data=await response.json();

    if(!response.ok){
      alert(data.message||"Update failed");
      return;
    }

    alert("Order status updated!");
    loadOrders();

  }catch(error){
    alert("Server connection error");
  }
}

function escapeHTML(value){
  return String(value??"").replace(/[&<>"']/g,char=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[char]));
}

function logout(){
  adminToken="";
  allOrders=[];

  document.getElementById("dashboard").style.display="none";
  document.getElementById("loginBox").style.display="block";
  document.getElementById("password").value="";
  document.getElementById("loginMessage").innerText="";
}
</script>

</body>
  </html>
