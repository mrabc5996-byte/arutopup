<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ARU TOPUP Admin</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:15px;background:#0b1220;color:white;font-family:Arial,sans-serif}
.wrap{max-width:1000px;margin:auto}
.panel{background:#17243a;padding:18px;border-radius:14px;margin:15px 0}
h2{color:#65a5ff}
input,select{width:100%;padding:12px;margin:7px 0;background:#0b1526;color:white;border:1px solid #34445e;border-radius:8px}
button{padding:10px 14px;border:0;border-radius:8px;background:#2878ff;color:white;font-weight:bold;margin:4px;cursor:pointer}
.red{background:#c73550}.green{background:#087c55}.gray{background:#40516b}
.hidden{display:none}
.item{background:#0b1526;padding:13px;border-radius:10px;margin:10px 0}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1}
.msg{color:#65e6a8;margin:8px 0}
@media(max-width:550px){.row{display:block}}
</style>
</head>
<body>
<div class="wrap">

<h2>💎 ARU TOPUP — ADMIN PANEL</h2>

<section id="loginPanel" class="panel">
<h3>Admin Login</h3>
<input id="password" type="password" placeholder="Admin Password">
<button onclick="login()">Login</button>
<p id="loginMsg"></p>
</section>

<main id="dashboard" class="hidden">

<section class="panel">
<div class="row">
<h2>Dashboard</h2>
<button class="gray" onclick="loadAll()">Refresh</button>
<button class="red" onclick="logout()">Logout</button>
</div>
<p id="message" class="msg"></p>
</section>

<!-- PRODUCT MANAGEMENT -->
<section class="panel">
<h2>📦 Product Management</h2>

<h3>Add New Product</h3>
<input id="pName" placeholder="Product Name">
<input id="pPrice" type="number" min="0" placeholder="Product Price">
<input id="pCategory" placeholder="Category (Diamond)">
<button onclick="addProduct()">＋ Add Product</button>

<hr>

<h3>Product List</h3>
<div id="productList">Loading...</div>
</section>

<!-- ORDER MANAGEMENT -->
<section class="panel">
<h2>🛒 Order Management</h2>
<div class="row">
<div class="item">Total Orders: <b id="total">0</b></div>
<div class="item">Pending: <b id="pending">0</b></div>
<div class="item">Completed: <b id="completed">0</b></div>
</div>
<input id="search" placeholder="UID / Player / Order ID দিয়ে খুঁজুন" oninput="renderOrders()">
<div id="orderList">Loading...</div>
</section>

</main>
</div>

<script>
let token=sessionStorage.getItem("aru_admin_token")||"";
let products=[];
let orders=[];

const $=id=>document.getElementById(id);

function headers(){
 return {
  "Content-Type":"application/json",
  "Authorization":"Bearer "+token
 };
}

function msg(t){
 $("message").textContent=t;
}

async function login(){
 try{
  const r=await fetch("/api/admin/login",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({password:$("password").value})
  });
  const d=await r.json();
  if(!r.ok||!d.token)throw Error(d.message||"Login failed");

  token=d.token;
  sessionStorage.setItem("aru_admin_token",token);
  $("loginPanel").classList.add("hidden");
  $("dashboard").classList.remove("hidden");
  loadAll();
 }catch(e){
  $("loginMsg").textContent=e.message;
 }
}

function logout(){
 token="";
 sessionStorage.removeItem("aru_admin_token");
 $("dashboard").classList.add("hidden");
 $("loginPanel").classList.remove("hidden");
}

async function loadAll(){
 await loadProducts();
 await loadOrders();
}

// PRODUCTS
async function loadProducts(){
 try{
  const r=await fetch("/api/admin/products",{headers:headers()});
  if(!r.ok)throw Error("Products load failed");
  products=await r.json();
  renderProducts();
 }catch(e){
  $("productList").textContent=e.message;
 }
}

function renderProducts(){
 if(!products.length){
  $("productList").innerHTML="<p>No products found.</p>";
  return;
 }

 $("productList").innerHTML=products.map(p=>`
 <div class="item">
  <b>${escapeHTML(p.name)}</b>
  <p>Price: ৳${Number(p.price)||0}</p>
  <p>Category: ${escapeHTML(p.category||"")}</p>
  <p>Status: ${p.active===false?"Inactive":"Active"}</p>
  <button onclick="editProduct('${p.id}')">Edit</button>
  <button class="gray" onclick="toggleProduct('${p.id}')">
   ${p.active===false?"Activate":"Deactivate"}
  </button>
  <button class="red" onclick="deleteProduct('${p.id}')">Delete</button>
 </div>`).join("");
}

async function addProduct(){
 const name=$("pName").value.trim();
 const price=Number($("pPrice").value);
 const category=$("pCategory").value.trim()||"Diamond";

 if(!name||$("pPrice").value===""||!Number.isFinite(price)||price<0){
  alert("সঠিক Product Name এবং Price দাও");
  return;
 }

 try{
  const r=await fetch("/api/admin/products",{
   method:"POST",
   headers:headers(),
   body:JSON.stringify({name,price,category,active:true})
  });
  const d=await r.json();
  if(!r.ok)throw Error(d.message||"Add failed");

  $("pName").value="";
  $("pPrice").value="";
  $("pCategory").value="";
  msg("Product added successfully");
  loadProducts();
 }catch(e){msg(e.message);}
}

async function editProduct(id){
 const p=products.find(x=>String(x.id)===String(id));
 if(!p)return;

 const name=prompt("Product Name:",p.name);
 if(name===null)return;
 const price=prompt("Product Price:",p.price);
 if(price===null)return;

 const newPrice=Number(price);
 if(!name.trim()||price.trim()===""||!Number.isFinite(newPrice)||newPrice<0){
  alert("সঠিক Name এবং Price দাও");
  return;
 }

 try{
  const r=await fetch("/api/admin/products/"+encodeURIComponent(id),{
   method:"PATCH",
   headers:headers(),
   body:JSON.stringify({name:name.trim(),price:newPrice})
  });
  const d=await r.json();
  if(!r.ok)throw Error(d.message||"Update failed");
  msg("Product updated");
  loadProducts();
 }catch(e){msg(e.message);}
}

async function toggleProduct(id){
 const p=products.find(x=>String(x.id)===String(id));
 if(!p)return;
 try{
  const r=await fetch("/api/admin/products/"+encodeURIComponent(id),{
   method:"PATCH",
   headers:headers(),
   body:JSON.stringify({active:p.active===false})
  });
  const d=await r.json();
  if(!r.ok)throw Error(d.message||"Update failed");
  loadProducts();
 }catch(e){msg(e.message);}
}

async function deleteProduct(id){
 if(!confirm("এই Product Delete করতে চাও?"))return;
 try{
  const r=await fetch("/api/admin/products/"+encodeURIComponent(id),{
   method:"DELETE",
   headers:headers()
  });
  const d=await r.json().catch(()=>({}));
  if(!r.ok)throw Error(d.message||"Delete failed");
  msg("Product deleted");
  loadProducts();
 }catch(e){msg(e.message);}
}

// ORDERS
async function loadOrders(){
 try{
  const r=await fetch("/api/admin/orders",{headers:headers()});
  if(!r.ok)throw Error("Orders load failed");
  orders=await r.json();
  renderOrders();
 }catch(e){
  $("orderList").textContent=e.message;
 }
}

function renderOrders(){
 const q=$("search").value.toLowerCase();
 const pending=orders.filter(o=>(o.status||"Pending")==="Pending").length;
 const completed=orders.filter(o=>o.status==="Completed").length;

 $("total").textContent=orders.length;
 $("pending").textContent=pending;
 $("completed").textContent=completed;

 const list=orders.filter(o=>
  [o.id,o.uid,o.playerName,o.package,o.transactionId]
  .some(v=>String(v||"").toLowerCase().includes(q))
 );

 if(!list.length){
  $("orderList").innerHTML="<p>No orders found.</p>";
  return;
 }

 $("orderList").innerHTML=list.map(o=>`
 <div class="item">
  <b>Order #${escapeHTML(o.id)}</b>
  <p>UID: ${escapeHTML(o.uid)}</p>
  <p>Player: ${escapeHTML(o.playerName||"")}</p>
  <p>Package: ${escapeHTML(o.package||"")}</p>
  <p>Price: ৳${Number(o.price)||0}</p>
  <p>Status: ${escapeHTML(o.status||"Pending")}</p>
  <button class="green" onclick="updateOrder('${o.id}','Completed')">Completed</button>
  <button class="gray" onclick="updateOrder('${o.id}','Pending')">Pending</button>
  <button class="red" onclick="updateOrder('${o.id}','Cancelled')">Cancel</button>
 </div>`).join("");
}

async function updateOrder(id,status){
 try{
  const r=await fetch("/api/admin/orders/"+encodeURIComponent(id),{
   method:"PATCH",
   headers:headers(),
   body:JSON.stringify({status})
  });
  const d=await r.json();
  if(!r.ok)throw Error(d.message||"Update failed");
  loadOrders();
 }catch(e){msg(e.message);}
}

function escapeHTML(v){
 return String(v??"").replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}

if(token){
 $("loginPanel").classList.add("hidden");
 $("dashboard").classList.remove("hidden");
 loadAll();
}
</script>
</body>
  </html>
